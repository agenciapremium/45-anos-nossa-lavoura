<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Success, warning, danger — soft fill + solid text" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;display:flex;align-items:center;font-family:var(--font-body)}.g{display:flex;gap:14px;align-items:stretch;width:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:96px;font-size:11px;font-weight:700;letter-spacing:.04em}.sw code{display:block;font-weight:400;opacity:.75;font-size:10px;font-family:ui-monospace,monospace}</style></head><body><div class="g">
<div class="sw" style="border-radius:16px;background:var(--status-success-soft);color:var(--status-success)">Success<code>--status-success</code></div>
<div class="sw" style="border-radius:16px;background:var(--status-warning-soft);color:var(--status-warning)">Warning<code>--status-warning</code></div>
<div class="sw" style="border-radius:16px;background:var(--status-danger-soft);color:var(--status-danger)">Danger<code>--status-danger</code></div>
<div class="sw" style="border-radius:16px;background:var(--status-info-soft);color:var(--status-info)">Info<code>--status-info</code></div>
</div></body></html>

<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="Every step from hero to label with its token" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;display:flex;align-items:center;font-family:var(--font-body)}.g{display:flex;gap:14px;align-items:stretch;width:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:96px;font-size:11px;font-weight:700;letter-spacing:.04em}.sw code{display:block;font-weight:400;opacity:.75;font-size:10px;font-family:ui-monospace,monospace}</style></head><body><table style="width:100%;border-collapse:collapse;font-size:12px;color:var(--text-muted)">
<tr><td style="font-family:var(--font-display);font-weight:700;font-size:44px;letter-spacing:-.03em;color:var(--text-strong);line-height:1.05">Hero</td><td style="text-align:right;font-family:ui-monospace,monospace">--text-hero · clamp 52→88</td></tr>
<tr><td style="font-family:var(--font-display);font-weight:700;font-size:32px;color:var(--text-strong);line-height:1.1">Display / H1</td><td style="text-align:right;font-family:ui-monospace,monospace">--text-display · --text-h1 40</td></tr>
<tr><td style="font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--text-strong);line-height:1.2">Heading H2</td><td style="text-align:right;font-family:ui-monospace,monospace">--text-h2 30</td></tr>
<tr><td style="font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text-strong);line-height:1.3">Subhead H3</td><td style="text-align:right;font-family:ui-monospace,monospace">--text-h3 22</td></tr>
<tr><td style="font-size:15px;color:var(--text-body);line-height:1.6">Body 15 / 1.5</td><td style="text-align:right;font-family:ui-monospace,monospace">--text-body-md</td></tr>
<tr><td style="font-size:13px;color:var(--text-body)">Small 13</td><td style="text-align:right;font-family:ui-monospace,monospace">--text-body-sm</td></tr>
<tr><td class="nl-eyebrow" style="color:var(--text-body)">Label 12 · 0.14em</td><td style="text-align:right;font-family:ui-monospace,monospace">--text-label</td></tr>
</table></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;display:flex;align-items:center;font-family:var(--font-body)}.g{display:flex;gap:14px;align-items:stretch;width:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:96px;font-size:11px;font-weight:700;letter-spacing:.04em}.sw code{display:block;font-weight:400;opacity:.75;font-size:10px;font-family:ui-monospace,monospace}</style></head><body><div class="g" style="gap:14px">
<div style="border-radius:16px;flex:1;background:var(--lima-500);color:var(--terra-900);padding:16px;font-size:12px;font-weight:700">Rest<br><span style="font-weight:400;font-family:ui-monospace,monospace;font-size:10px">--lima-500</span></div>
<div style="border-radius:16px;flex:1;background:var(--lima-600);color:var(--terra-900);padding:16px;font-size:12px;font-weight:700">Hover<br><span style="font-weight:400;font-family:ui-monospace,monospace;font-size:10px">--lima-600 · 160ms</span></div>
<div style="border-radius:16px;flex:1;background:var(--lima-600);color:var(--terra-900);padding:16px;font-size:12px;font-weight:700;transform:translateY(1px)">Press<br><span style="font-weight:400;font-family:ui-monospace,monospace;font-size:10px">translateY(1px)</span></div>
<div style="border-radius:16px;flex:1;background:var(--lima-500);color:var(--terra-900);padding:16px;font-size:12px;font-weight:700;opacity:.42">Disabled<br><span style="font-weight:400;font-family:ui-monospace,monospace;font-size:10px">opacity .42</span></div>
<div style="border-radius:16px;flex:1;background:var(--branco);padding:16px;font-size:12px;font-weight:700;outline:3px solid var(--lima-500);outline-offset:2px">Focus<br><span style="font-weight:400;font-family:ui-monospace,monospace;font-size:10px">3px lima ring</span></div>
</div></body></html>

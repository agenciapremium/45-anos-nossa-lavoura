<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px;display:flex;align-items:center;font-family:var(--font-body)}.g{display:flex;gap:14px;align-items:stretch;width:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:96px;font-size:11px;font-weight:700;letter-spacing:.04em}.sw code{display:block;font-weight:400;opacity:.75;font-size:10px;font-family:ui-monospace,monospace}</style></head><body><div class="g" style="gap:12px">
<div style="border-radius:16px;flex:1;background:var(--creme-500);padding:16px"><div style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-strong)">Aa terra</div><div style="font-size:13px;color:var(--text-body)">--text-body</div><div style="font-size:13px;color:var(--text-muted)">--text-muted</div></div>
<div style="border-radius:16px;flex:1;background:var(--terra-700);padding:16px"><div style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-on-inverse)">Aa creme</div><div style="font-size:13px;color:var(--text-on-inverse)">--text-on-inverse</div><div style="font-size:13px;color:var(--text-on-inverse-muted)">--text-on-inverse-muted</div></div>
<div style="border-radius:16px;flex:1;background:var(--lima-500);padding:16px"><div style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-on-accent)">Aa lima</div><div style="font-size:13px;color:var(--text-on-accent)">--text-on-accent</div><div style="font-size:13px;color:var(--terra-500)">--terra-500</div></div>
</div></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;background:var(--terra-700);display:flex;align-items:center;justify-content:center;padding:0 60px}
.mark{font-family:var(--font-display);font-weight:700;font-size:150px;line-height:.92;letter-spacing:-.03em;color:var(--creme-500);text-align:center;white-space:nowrap}
.mark em{display:block;font-style:normal;color:var(--lima-500)}
.strip{flex:1;display:flex;flex-direction:column}.strip div{flex:1}
</style></head><body>
<div class="main"><div class="mark">NOSSA<em>LAVOURA</em></div></div>
<div class="strip"><div style="background:var(--lima-300)"></div><div style="background:var(--lima-500)"></div><div style="background:var(--lima-700)"></div><div style="background:var(--terra-900)"></div></div>
</body></html>

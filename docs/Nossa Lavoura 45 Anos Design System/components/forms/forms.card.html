<!DOCTYPE html><html lang="pt-BR" data-nl-assets="../../assets/icons"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page);padding:20px;display:flex;align-items:center}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.NossaLavoura45AnosDesignSystem_30d0cd;
function Demo(){
  const [v,setV]=React.useState('Recria');
  const [ok,setOk]=React.useState(true);
  const [on,setOn]=React.useState(true);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,width:'100%'}}>
    <Input label="Nome" placeholder="Seu nome"/>
    <Input label="WhatsApp" defaultValue="(69) 99999-0000" hint="Retorno em 1 dia útil."/>
    <Input label="E-mail" defaultValue="joao@fazenda" error="Informe um e-mail válido."/>
    <Select label="Rebanho" placeholder="Selecione" options={['Corte','Leite','Cria']}/>
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <Checkbox label="Aceito receber ofertas" checked={ok} onChange={e=>setOk(e.target.checked)}/>
      <Checkbox label="Opção desabilitada" disabled/>
      <Switch label="Catálogo por e-mail" checked={on} onChange={e=>setOn(e.target.checked)}/>
    </div>
    <Radio name="fase" value={v} onChange={setV} options={['Cria','Recria','Engorda']}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>

schema: spec-driven

context: |
  Produto: Circuito de Palestras Acelera no Campo 3.0 (Nossa Lavoura / Grupo Axia Agro).
  Operadora: Agência Premium. PRD de origem:
  docs/PRD · Confirmação de Presença · Circuito de Palestras Acelera no Campo 3.0.md

  Estado atual do repositório: site ESTÁTICO (index.html, styles.css, tokens.css,
  main.js, /foto-comemorativa), publicado na Vercel em
  45anosnossalavoura.agpremium.com.br. NÃO existe package.json nem Next.js hoje.
  A change `fundacao` introduz a base Next.js.

  Decisões tomadas pela cliente (28/09/2026), que valem para todas as changes:
  - A landing dos 45 anos e a /foto-comemorativa são RECONSTRUÍDAS como páginas
    React do App Router. O HTML estático é eliminado. URLs, conteúdo visível e
    SEO permanecem idênticos; só a tecnologia muda.
  - O banco Neon já está provisionado e conectado ao projeto da Vercel; as
    variáveis estão no .env local (não versionado).
  - Convite cancelado NÃO gera reposição automática: o Admin repõe gerando um
    novo lote quando julgar necessário.
  - Não há etapa de mockup descartável. As telas são implementadas em Next, com
    dados de exemplo quando preciso, e validadas pela cliente no preview da
    Vercel antes de a lógica de domínio ser finalizada.
  - Identidade visual: usar o design system que já está em tokens.css (paleta
    terra/lima/creme, Parkinsans display, Hanken Grotesk texto, elevação por
    slab de cor, octógono só como fundo). Configurar o Tailwind a partir desses
    tokens. Nas superfícies do circuito (páginas públicas de palestras,
    ingresso, PDF, lista impressa, painéis) usar
    assets/img/selo_circuito_acelera_no_campo.webp no lugar do selo dos 45 anos.
    O selo do circuito traz as marcas Virbac e Supremax: nunca recortar nem
    distorcer, e não usar como favicon.
  - Copy aprovada da mensagem de WhatsApp: ver D2b em
    openspec/changes/fundacao/design.md.
  - Textos de consentimento aprovados: ver D9b em
    openspec/changes/confirmacao-convidado/design.md. Devem vir de configuração,
    não embutidos no JSX.
  - Retenção indeterminada, sem rotina de expurgo automático; eliminação apenas
    a pedido do titular, operada pelo Admin. Ver D9c na mesma change.

  Stack alvo: Next.js (App Router) + TypeScript, Tailwind + shadcn/ui, Neon Postgres
  + Drizzle ORM, Better Auth, Resend + React Email, Zod, qrcode + @zxing/browser,
  @react-pdf/renderer, papaparse, Vercel Cron.

  Convenções:
  - Todo o módulo vive sob a rota /palestras; a landing atual e /foto-comemorativa
    devem continuar respondendo nas mesmas URLs.
  - Tabelas de domínio usam prefixo `palestra_`; tabelas do Better Auth seguem o
    esquema nativo (user, session, account, verification).
  - Fuso America/Porto_Velho (UTC-4) para prazos; prazo = 23h59 da véspera.
  - CPF armazenado só com dígitos; exibido mascarado exceto para Admin.
  - Idioma do produto, da UI e dos artefatos: português do Brasil.
  - Papéis: admin, gerente_regional, gerente_loja, colaborador, recepcao.
  - Estados do convite: disponivel, confirmado, presente, expirado, cancelado.

  Ordem das changes (dependências): fundacao → confirmacao-convidado e
  auth-e-papeis → painel-colaborador → operacao-evento.
  Cada change passa por PROPOSE, MOCKUP (validação de telas) e APPLY.

rules:
  proposal:
    - Escrever em português do Brasil.
    - Referenciar o PRD quando a decisão vier de lá.
  specs:
    - Escrever em português do Brasil, com SHALL/MUST nos requisitos.
    - Cada cenário deve ser testável e rastreável a um critério de aceite do PRD.
  design:
    - Registrar alternativas consideradas e o motivo da escolha.
    - Listar em Open Questions tudo que depende de resposta da cliente ou do DPO.
  tasks:
    - Incluir um grupo de tarefas MOCKUP antes das tarefas de domínio, quando a
      change tiver telas novas.
